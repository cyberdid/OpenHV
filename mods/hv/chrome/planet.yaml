Background@PLANET_PANEL:
	Logic: PlanetLogic
	X: (WINDOW_WIDTH - WIDTH) / 2
	Y: (WINDOW_HEIGHT - HEIGHT) / 2
	Width: 760
	Height: 500
	Children:
		Label@PLANET_TITLE:
			Y: 12
			Width: PARENT_WIDTH
			Height: 25
			Align: Center
			Font: Bold
		Label@PLANET_STATUS:
			Y: 34
			Width: PARENT_WIDTH
			Height: 18
			Align: Center
			Font: TinyBold
		PlanetMap@PLANET_MAP:
			X: 20
			Y: 58
			Width: 520
			Height: 300
		Container@OVERLAY_BUTTONS:
			X: 20
			Y: 366
			Width: 520
			Height: 26
			Children:
				Button@TERRAIN_BUTTON:
					Width: 82
					Height: 24
					Text: button-planet-terrain
					Font: TinyBold
				Button@TEMPERATURE_BUTTON:
					X: 87
					Width: 82
					Height: 24
					Text: button-planet-temperature
					Font: TinyBold
				Button@PRESSURE_BUTTON:
					X: 174
					Width: 82
					Height: 24
					Text: button-planet-pressure
					Font: TinyBold
				Button@WIND_BUTTON:
					X: 261
					Width: 82
					Height: 24
					Text: button-planet-wind
					Font: TinyBold
				Button@PRECIPITATION_BUTTON:
					X: 348
					Width: 82
					Height: 24
					Text: button-planet-rain
					Font: TinyBold
				Button@VERTICAL_BUTTON:
					X: 435
					Width: 82
					Height: 24
					Text: button-planet-vertical
					Font: TinyBold
		Background@CELL_PANEL:
			X: 556
			Y: 58
			Width: 184
			Height: 334
			Background: scrollpanel-bg
			Children:
				Label@CELL_INFO:
					X: 10
					Y: 8
					Width: PARENT_WIDTH - 20
					Height: PARENT_HEIGHT - 16
					Font: TinyBold
					VAlign: Top
		Button@REFRESH_BUTTON:
			X: 20
			Y: PARENT_HEIGHT - 46
			Width: 140
			Height: 30
			Text: button-planet-refresh
			Font: Bold
		Button@FIGHT_BUTTON:
			X: 176
			Y: PARENT_HEIGHT - 46
			Width: 180
			Height: 30
			Text: button-planet-legacy-battle-export
			Font: Bold
		Button@BACK_BUTTON:
			X: PARENT_WIDTH - 160
			Y: PARENT_HEIGHT - 46
			Width: 140
			Height: 30
			Key: escape
			Text: button-back
			Font: Bold
